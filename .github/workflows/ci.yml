name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.13"]
        # The hooks are /bin/sh and the run lock is flock, so macOS is the other platform specky
        # claims. One entry is enough to catch a BSD-vs-GNU tool difference.
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
        with:
          # smoke-test.sh indexes this repo's own git log, so the shallow default clone
          # would leave it with a single commit to index.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv sync --all-groups

      - name: pytest
        run: uv run pytest

      # Exercises the real CLI against this repo's own specs/ tree — the one thing the
      # tmpdir-based tests can't cover. No AI provider needed: index/search/render-html
      # are all offline.
      - name: smoke test
        run: scripts/smoke-test.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # specky check resolves a base revision and reads commit_links, neither of which
          # survives a shallow clone.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-groups

      # Dogfooding the gate this repo ships: fail if a change edits code that a doc describes
      # without updating that doc. No AI provider involved — index and check are both offline.
      - name: doc coverage
        run: |
          uv run specky index
          uv run specky check --base "$BASE"
        env:
          # On a pull request the range is the whole branch; on a push to main it's that push,
          # which is what makes the gate cover a direct push too. HEAD~1 covers the very first
          # push to a branch, where there's no `before`.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
