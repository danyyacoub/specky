# Cut a release by pushing a `vX.Y.Z` tag. Nothing is published unless the tag, the package version
# and the plugin version all agree and CHANGELOG.md has a section for it, because the two
# distributions are versioned separately: PyPI reads `specky.__version__`, while Claude Code only
# offers a plugin update when `.claude-plugin/plugin.json` changes its `version`.
#
# PyPI publishing uses trusted publishing (OIDC), so there is no token to store. One-time setup: a
# pending trusted publisher on pypi.org for project `specky`, workflow `release.yml`, environment
# `pypi`, and a `pypi` environment in this repo's settings.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The test suite indexes this repo's own history.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check the versions agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project python - <<'PY'
          import json, os, re, sys
          from pathlib import Path

          tag = os.environ["TAG"].removeprefix("v")
          init = Path("src/specky/__init__.py").read_text()
          package = re.search(r'__version__ = "([^"]+)"', init).group(1)
          plugin = json.loads(Path(".claude-plugin/plugin.json").read_text())["version"]
          changelog = f"## [{tag}]" in Path("CHANGELOG.md").read_text()

          problems = []
          if package != tag:
              problems.append(f"specky.__version__ is {package}")
          if plugin != tag:
              problems.append(f".claude-plugin/plugin.json version is {plugin}")
          if not changelog:
              problems.append(f"CHANGELOG.md has no '## [{tag}]' section")
          if problems:
              sys.exit(f"tag v{tag} doesn't match: " + "; ".join(problems))
          print(f"v{tag}: package, plugin and changelog agree")
          PY

      - run: uv sync --all-groups

      - name: pytest
        run: uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # This version's CHANGELOG section: everything after its heading, up to the next one.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$TAG" dist/* --title "specky $version" --notes-file notes.md
